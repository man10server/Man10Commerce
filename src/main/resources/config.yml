mysql:
  db:
  pass:
  host:
  port: 3306
  user:
  useSSL: false
  # 1クエリの実行時間の上限(秒)。0で無制限。
  # 起動時のスキーマ適用とアイテム辞書の読み込みは対象外。
  queryTimeoutSeconds: 3
  # Extra JDBC parameters appended to the connection URL.
  properties:
    allowPublicKeyRetrieval: true
    rewriteBatchedStatements: true
  # HikariCP connection pool. The plugin uses one writer thread, `readThreads`
  # reader threads and one log writer, so the default size has plenty of headroom.
  pool:
    maximumPoolSize: 10
    minimumIdle: 2
    # DBが落ちている間、取引スレッドはこの2倍まで待たされる
    connectionTimeoutMs: 3000
    validationTimeoutMs: 3000
    idleTimeoutMs: 600000
    maxLifetimeMs: 1740000
    keepaliveTimeMs: 300000
    leakDetectionThresholdMs: 20000
    # Startup fails (and the plugin disables itself) when no connection can be
    # obtained within this many milliseconds.
    initializationFailTimeoutMs: 10000

# Threads serving read-only menu queries. Writes always stay on a single thread
# so that buy/sell/close remain serialized.
readThreads: 4

# Seconds the cheapest-listing-per-item result is reused before it is queried
# again. 0 disables the cache.
minPriceCacheSeconds: 5

fee: 0.1
