import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
}

group = 'red.man10'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        name = 'sonatype'
        url = uri('https://oss.sonatype.org/content/groups/public/')
    }
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    compileOnly ("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: 'org.bukkit', module: 'bukkit'
    }
    // Resolved at runtime through the `libraries` block in plugin.yml.
    compileOnly 'com.zaxxer:HikariCP:5.1.0'
    compileOnly 'com.mysql:mysql-connector-j:8.4.0'
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

// Paper 1.21.8 runs on Java 21, so that is what the plugin has to target.
// Gradle itself runs on any JDK 17+ and provisions this toolchain on its own.
def targetJavaVersion = 21

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget(targetJavaVersion.toString())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
